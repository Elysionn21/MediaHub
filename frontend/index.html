<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediaHub</title><link rel="stylesheet" href="style.css"><style>.header-button{display:flex;align-items:center;gap:7px!important;font-size:12px}.header-button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.modal-backdrop{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:7}.modal-backdrop.hidden{display:none}.modal{width:min(460px,calc(100vw - 36px));padding:22px;background:#18181b;border:1px solid #3f3f46;border-radius:14px;box-shadow:0 22px 70px #0009}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.modal h2{font-size:19px;margin:0}.modal label{display:block;color:#a1a1aa;font-size:12px;margin:16px 0 8px}.modal select,.modal input{width:100%;height:40px;padding:0 11px;border:1px solid #3f3f46;border-radius:8px;background:#0f0f12;color:#f4f4f5}.folder-row{display:flex;gap:8px}.folder-row input{flex:1;min-width:0}.folder-row button,.modal-actions button{white-space:nowrap;height:40px}.modal-actions{display:flex;justify-content:flex-end;margin-top:22px}.icon-button{border:0;background:transparent;color:#a1a1aa;font-size:23px;cursor:pointer}.titlebar .header-button{height:36px}.logo{object-fit:contain;background:transparent;border-radius:0}</style></head>
<body><header class="titlebar"><div class="brand"><img class="logo" src="MediaHubIcon.png" alt="MediaHub logo"><div><strong>MediaHub</strong><span class="version">0.1.0</span></div><span id="status" class="status">Starting</span></div><div class="window-actions"><button id="updateYtdlp" class="header-button" title="Update yt-dlp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"/></svg><span id="updateLabel">Update</span></button><button id="settings" class="header-button" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 1.9Z"/></svg><span id="settingsLabel">Settings</span></button><button id="minimise" title="Minimise">—</button><button id="close" class="close" title="Close">×</button></div></header>
<main><section class="hero"><div class="eyebrow" id="eyebrow">MEDIA HUB</div><h1 id="heroTitle">Play or download.</h1><p id="heroSubtitle">Add a media link to get started.</p><div id="dropzone" class="input-row"><span class="link-icon">↗</span><input id="url" placeholder="Paste a video link here" autocomplete="off"><button id="paste" class="quiet">Paste</button></div><div class="actions"><button id="play" class="primary">▶　Play via VLC</button><button id="download" class="secondary">↓　Download</button><select id="format" aria-label="Download format"><option value="video">Video</option><option value="audio">MP3 audio</option></select></div><div id="drop-hint">Drag and drop a link here</div></section>
<section class="library"><div class="tabs"><button id="activeTab" class="tab selected">Downloads</button><button id="historyTab" class="tab">History</button></div><div id="downloads" class="items"><div class="empty">No active downloads</div></div><div id="history" class="items hidden"></div></section></main><div id="settingsModal" class="modal-backdrop hidden"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><h2 id="modalTitle">Settings</h2><button id="settingsClose" class="icon-button" aria-label="Close">×</button></div><label id="languageLabel" for="languageSelect">Language</label><select id="languageSelect"><option value="en">English</option><option value="tr">Türkçe</option></select><label id="folderLabel" for="folderPath">Download folder</label><div class="folder-row"><input id="folderPath" type="text"><button id="browseFolder" class="secondary">Browse</button></div><div class="modal-actions"><button id="saveSettings" class="primary">Save settings</button></div></section></div><div id="toast" class="toast"></div><div id="overlay" class="overlay"><div class="loader"></div><strong id="overlayText">MediaHub is starting…</strong></div><script src="app.js"></script></body></html>
